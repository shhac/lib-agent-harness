name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      # Every platform reports, so one platform's failure cannot hide another's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI runs unsandboxed: a test that would skip because the environment
      # refused it fails instead, so no coverage is lost silently.
      AGENT_HARNESS_TEST_NO_SKIP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
