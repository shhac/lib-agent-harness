name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    strategy:
      # Every platform reports, so one platform's failure cannot hide another's.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI runs unsandboxed: a test that would skip because the environment
      # refused it fails instead, so no coverage is lost silently.
      AGENT_HARNESS_TEST_NO_SKIP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Install Linux command sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap netcat-openbsd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Ubuntu 24.04 and bubblewrap 0.9
        if: runner.os == 'Linux'
        shell: bash
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          uname -a
          go version
          bwrap --version | tee "$RUNNER_TEMP/bwrap-version"
          grep -Eq '^bubblewrap 0\.9\.[0-9]+$' "$RUNNER_TEMP/bwrap-version"
      - name: Prepare workspace bind-mount witness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          witness="$RUNNER_TEMP/workbench-mount"
          mkdir -p "$witness/source" "$witness/work/parent/mount"
          printf 'OUTSIDE-BIND-MOUNT-MARKER' > "$witness/source/marker"
          touch "$witness/work/parent/filemount"
          sudo mount --bind "$witness/source" "$witness/work/parent/mount"
          sudo mount --bind "$witness/source/marker" "$witness/work/parent/filemount"
          echo "AGENT_HARNESS_TEST_BIND_MOUNT=$witness/work" >> "$GITHUB_ENV"
      - name: Verify real refusal fixtures in both parent modes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for strict in 0 1; do
            output="$RUNNER_TEMP/refusal-parent-$strict.log"
            AGENT_HARNESS_TEST_NO_SKIP="$strict" go test -race -count=1 -v ./sandbox -run '^TestCommandSandboxRunSkipsRefusedCapabilities$' | tee "$output"
            # A skipped outer prerequisite is not child execution evidence.
            grep -q '^--- PASS: TestCommandSandboxRunSkipsRefusedCapabilities' "$output"
            modes="nested socket"
            if [ "$RUNNER_OS" = macOS ]; then modes="$modes loopback"; fi
            for mode in $modes; do
              grep -q "child $mode strict=false exit=0 verified" "$output"
              grep -Eq "child $mode strict=true exit=[1-9][0-9]* verified" "$output"
            done
          done
      - name: Repeat lease cancellation and survivor liveness
        if: runner.os != 'Windows'
        run: go test -race -count=20 -v ./session -run '^TestReclaimKeepsTheLeaseWhileWaiting$'
      - run: go test -race ./...
      - name: Check the full suite inside bubblewrap
        if: runner.os == 'Linux'
        run: go run ./internal/cmd/sandboxcheck
      - name: Repeat background tree priority proof
        if: runner.os != 'Windows'
        run: go test -race ./process -run '^TestBackgroundLowersTheWholeTree$' -count=20 -v
  linux-bwrap-080:
    name: linux (bubblewrap 0.8.0)
    runs-on: ubuntu-latest
    env:
      AGENT_HARNESS_TEST_NO_SKIP: '1'
      AGENT_HARNESS_TEST_BWRAP_080: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the oldest supported bubblewrap from its upstream tarball
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd meson ninja-build pkg-config libcap-dev libselinux1-dev libglib2.0-dev xsltproc docbook-xsl debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Debian 12 preserves the upstream 0.8.0 tarball. apt authenticates
          # the source index with the Debian archive keyring; then explicitly
          # check the tarball's SHA-256 from that authenticated source package.
          printf '%s\n' 'deb-src [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian bookworm main' > "$RUNNER_TEMP/bookworm.sources.list"
          sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/bookworm.sources.list" -o Dir::Etc::sourceparts=- update
          mkdir "$RUNNER_TEMP/bwrap-source"
          cd "$RUNNER_TEMP/bwrap-source"
          apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/bookworm.sources.list" -o Dir::Etc::sourceparts=- source --download-only bubblewrap
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          dsc = next(Path('.').glob('bubblewrap_*.dsc')).read_text()
          checksums = dsc.split('Checksums-Sha256:\n', 1)[1].split('\n\n', 1)[0]
          tarball = next(p for p in Path('.').glob('bubblewrap_0.8.0.orig.tar.*')
                         if p.suffix in {'.xz', '.gz', '.bz2'})
          expected = next(line.split()[0] for line in checksums.splitlines()
                          if len(line.split()) == 3 and line.split()[2] == tarball.name)
          if hashlib.sha256(tarball.read_bytes()).hexdigest() != expected:
              raise SystemExit('upstream bubblewrap tarball SHA-256 mismatch')
          Path('upstream').mkdir()
          subprocess.run(['tar', '-xf', str(tarball), '-C', 'upstream',
                          '--strip-components=1'], check=True)
          PY
          meson setup upstream/build upstream --prefix="$RUNNER_TEMP/bwrap-0.8.0" --buildtype=release
          meson compile -C upstream/build
          meson install -C upstream/build
          echo "$RUNNER_TEMP/bwrap-0.8.0/bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - name: Minimum-version sandbox, canary, syscall and session tests
        shell: bash
        run: |
          witness="$RUNNER_TEMP/workbench-mount"
          mkdir -p "$witness/source" "$witness/work/parent/mount"
          printf 'OUTSIDE-BIND-MOUNT-MARKER' > "$witness/source/marker"
          touch "$witness/work/parent/filemount"
          sudo mount --bind "$witness/source" "$witness/work/parent/mount"
          sudo mount --bind "$witness/source/marker" "$witness/work/parent/filemount"
          AGENT_HARNESS_TEST_BIND_MOUNT="$witness/work" go test -race ./...
